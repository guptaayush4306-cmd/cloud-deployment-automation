name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Run health endpoint test
        working-directory: backend
        run: python -m pytest tests -v

      - name: Build Docker image
        run: docker build -f backend/dockerfile -t cloud-deploy-app:${{ github.sha }} backend
